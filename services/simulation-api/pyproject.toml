[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cathsim-simulation-api"
version = "0.1.0"
description = "CathSim LA simulation transport API (research prototype, not for clinical use)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "numpy>=1.26",
  "cathsim-physics-core",
]

[tool.setuptools.packages.find]
where = ["src"]
