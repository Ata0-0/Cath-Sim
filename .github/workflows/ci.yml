name: CI

# Research prototype - Not for clinical use.

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python - lint, types, validation suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e packages/physics-core
      - name: Ruff lint
        run: ruff check packages services scripts
      - name: Ruff format check
        run: ruff format --check packages services scripts
      - name: Type check
        run: mypy packages/physics-core/src packages/geometry-core/src services/simulation-api/src
        continue-on-error: true
      - name: Validation suite
        run: pytest -q -s

  typescript:
    name: TypeScript - lint, types, solver parity, UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit, parity and UI tests
        run: npm test

  schema:
    name: Schema - generated types are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate and diff
        run: |
          python scripts/generate_types.py
          git diff --exit-code -- apps/viewer/src/generated \
            || (echo "::error::Generated types are stale. Run 'python scripts/generate_types.py' and commit the result." && exit 1)

  e2e:
    name: End-to-end - the viewer actually opens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/viewer/playwright-report/
          retention-days: 7
